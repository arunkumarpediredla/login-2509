# Generated by Helm template for nginx services for deployment-nginx.yaml

{{- range $key, $app := .Values.applications }}
apiVersion: {{ $app.apiVersion | default "apps/v1" }}
kind: {{ $app.kind | default "Deployment" }}
metadata:
  name: {{ $app.deployment.name }}
spec:
  replicas: {{ $app.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ $app.deployment.appLabel }}
  template:
    metadata:
      labels:
        app: {{ $app.deployment.appLabel }}
    spec:
      containers:
      - name: {{ $app.deployment.containerName }}
        image: {{ $app.deployment.image }}
        ports:
        - containerPort: {{ $app.deployment.containerPort }}
{{- end }}
