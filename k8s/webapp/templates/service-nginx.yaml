# Generate nginx service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
spec:
  type: {{ .Values.service.type }}
  selector:
      app: {{ .Values.deployment.appLabel }}
  ports:
      - protocol: TCP
        port: {{ .Values.service.port }}
        targetPort: {{ .Values.deployment.port }}
        nodePort: {{ .Values.service.nodePort }}
