# Generated by Helm template for nginx services
{{- range $key, $app := .Values.applications }}
apiVersion: {{ $app.apiVersion | default "v1" }}
kind: {{ $app.kind | default "Service" }}
metadata:
  name: {{ $app.service.name }}
spec:
  type: {{ $app.service.type }}
  selector:
    app: {{ $app.deployment.appLabel }}
  ports:
    - protocol: TCP
      port: {{ $app.service.port }}
      targetPort: {{ $app.deployment.port }}
      nodePort: {{ $app.service.nodePort }}
{{- end }}
